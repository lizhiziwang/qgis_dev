repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-PyYAML]
        args: [--config-file=pyproject.toml]

  - repo: local
    hooks:
      - id: check-import-placement
        name: check function-level imports (docs/coding-standards.md §4)
        entry: python scripts/check_import_placement.py app
        language: system
        pass_filenames: false
        files: ^app/.*\.py$
