[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis_dev"
version = "0.2.0"
description = "PyQGIS desktop + FastAPI tile/check service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "zsh" }]

dependencies = [
    # GUI：Qt 绑定统一走 QGIS 自带的 qgis.PyQt（兼容 PyQt5 / PyQt6，由 QGIS 版本决定）；
    # 这里保留 PyQt6 声明便于 pip 环境解析，运行时不直接 import PyQt6。
    "PyQt6>=6.7",
    # QGIS 由宿主机或 conda 提供，不在这里锁
    # GIS 数据
    "gdal>=3.6",
    "rasterio>=1.3",
    "networkx>=3.0",
    "scipy>=1.10",
    # 服务
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    # 配置
    "PyYAML>=6.0",
    # DB
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
qgis_dev = "app.bootstrap:main"
qgis_dev_server = "app.server.cli:main"

# ---------------------------------------------------------------------------
# 让 ``pip install -e .`` 把 app.* 装到 site-packages，
# 之后任意 ``python -c "import app.xxx"`` 都直接能找到，不需要 sys.path hack。
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "legacy*", "tools*", "scripts*"]

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "build", "dist", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "S101"]
"legacy/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["legacy", "build", "dist", ".venv"]
mypy_path = ["app"]

[[tool.mypy.overrides]]
module = [
    "qgis.core",
    "qgis.gui",
    "qgis._core",
    "qgis._gui",
    "qgis.utils",
    "qgis.PyQt",
    "PyQt6.*",
    "osgeo.*",
    "processing",
    "fastapi",
    "uvicorn",
    "starlette.*",
    "rasterio",
    "networkx",
    "scipy.*",
    "psycopg2",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --import-mode=importlib"
markers = [
    "gui: 需要图形界面（xvfb-run 跑）",
    "slow: 慢测试（CI 才跑）",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["legacy/**", "tests/**", "tools/**"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
fail_under = 60
