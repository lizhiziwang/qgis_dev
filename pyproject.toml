[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis_dev"
version = "0.2.0"
description = "PyQGIS desktop + FastAPI tile/check service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "zsh" }]

dependencies = [
    # GUI：Qt 绑定统一走 QGIS 自带的 qgis.PyQt（兼容 PyQt5 / PyQt6，由 QGIS 版本决定）；
    # 这里保留 PyQt6 声明便于 pip 环境解析，运行时不直接 import PyQt6。
    "PyQt6>=6.7",
    # QGIS 由宿主机或 conda 提供，不在这里锁
    # GIS 数据
    "gdal>=3.6",
    "rasterio>=1.3",
    "numpy>=1.24",
    "networkx>=3.0",
    "scipy>=1.10",
    # 服务
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    # 配置
    "PyYAML>=6.0",
    # DB
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
qgis_dev = "app.bootstrap:main"
qgis_dev_server = "app.server.cli:main"

# ---------------------------------------------------------------------------
# 让 ``pip install -e .`` 把 app.* 装到 site-packages，
# 之后任意 ``python -c "import app.xxx"`` 都直接能找到，不需要 sys.path hack。
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "legacy*", "tools*", "scripts*"]

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "build", "dist", ".venv", "node_modules"]

[tool.ruff.lint]
# 规范见 docs/coding-standards.md
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "BLE", "C4", "PT", "RET", "SIM", "TID", "RUF", "ASYNC"]
ignore = [
    "E501",     # 行宽交给 ruff format
    "RUF001",   # 中文注释/字符串刻意使用全角标点
    "RUF002",   # 同上（docstring）
    "RUF003",   # 同上（注释）
]
# PLC0415（函数内 import）由 scripts/check_import_placement.py 检查：它允许
# 重依赖延迟导入（ruff 无法区分），只对轻量导入报警。声明为 external 可让
# RUF100 接受循环依赖处 `# noqa: PLC0415 - <原因>` 的标注。
external = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "S101"]
"legacy/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pep8-naming]
# Qt / QGIS 事件与虚函数覆盖必须保持 C++ 驼峰名，否则 Qt 无法回调；
# 用 glob 集中豁免（比逐行 # noqa: N802 更易维护，也不会产生 RUF100）。
extend-ignore-names = [
    "*Event",          # closeEvent / showEvent / paintEvent / nativeEvent / mouse*Event ...
    "eventFilter",
    "sizeHint",
    "rowCount",
    "columnCount",
    "headerData",
    "setData",
    "push*",           # QgsProcessingFeedback / 自定义 logger 风格回调
    "reportError",
    "fatalError",      # reportError(error, fatalError) 签名参数
    "eventType",       # nativeEvent(self, eventType, message) 覆盖签名
    "processingContext",
    "*Completed",      # Qt Signal 属性沿用 camelCase（与 C++ 信号一致）
    "*Terminated",
    "*Confirmed",
    "basePass",        # Pydantic 字段，对应外部配置键名，不可改
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["legacy", "build", "dist", ".venv"]
mypy_path = ["app"]

[[tool.mypy.overrides]]
module = [
    "qgis.core",
    "qgis.gui",
    "qgis._core",
    "qgis._gui",
    "qgis.utils",
    "qgis.PyQt",
    "PyQt6.*",
    "osgeo.*",
    "processing",
    "fastapi",
    "uvicorn",
    "starlette.*",
    "rasterio",
    "networkx",
    "scipy.*",
    "psycopg2",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --import-mode=importlib"
markers = [
    "gui: 需要图形界面（xvfb-run 跑）",
    "slow: 慢测试（CI 才跑）",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["legacy/**", "tests/**", "tools/**"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
fail_under = 60
