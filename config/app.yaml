# qgis_dev 主配置
# ---------------------------------------------------------------------------
# env:
#   dev  —— 本地开发，启动器用 qgis.install_path
#   prod —— 打包后运行，路径走环境变量（QGIS_PREFIX）
# ---------------------------------------------------------------------------

env: dev

app:
  name: 图斑核实平台
  # 版本唯一事实源：改版本只改这一行（major.minor.patch），
  # VERSION_CODE 由它自动算出（major*10000+minor*100+patch）。
  # 界面标题、build_info.json、更新清单、安装包版本都从这里读；
  # 升级时安装器会保留本文件，但会把这一行改成新版本号。
  version: "1.0.9"
  language: zh-Hans       # i18n
  crs: EPSG:4490          # 默认坐标系（中国 2000）
  # 「帮助」菜单（顶部最后一个页签）
  help:
    # 使用手册：Word 文档路径。相对路径按“项目根目录 / 便携包根目录”解析，
    # 也可写绝对路径（如 D:/document/使用手册.docx）。
    manual_path: docs/使用手册.docx
    # 在线使用文档地址：填写后优先于 manual_path（后续换在线文档只改这里）。
    manual_url: ""
    # 在线问题反馈地址：留空时使用内置反馈页面（cs-feedback）。
    feedback_url: ""
# 外部服务地址。problem-feedback 网关同时提供反馈页与更新清单/下载接口。
# 线上经 9003 端口代理；本地联调 problem-feedback 时改成 6111 端口即可。
services:
  feedback_url: "http://182.108.40.116:9003/cs-feedback/"

# 自动检测更新（完整说明见 .claude/archive/2026-10-22_检测更新方案.md）
update:
  enabled: true
  base_url: ""             # 留空 = services.feedback_url
  # internal = 未做代码签名的内网包；stable 只接受签名包（客户端 fail closed）
  channel: "internal"
  check_on_startup: true
  startup_delay_ms: 10000  # 主窗口显示后再等 10s，避开启动高峰
  check_interval_hours: 4
  request_timeout_seconds: 20
# 【已废弃】启动登录已改为授权服务器鉴权，本段不再参与校验，仅为 AppConfig
# 兼容保留。授权服务器地址按本文件顶部的 env 选段（dev / prod…）：见
# app/core/auth/config.py 的 PROFILES，加一个环境 = 在那里加一段 + 把这里的
# env: 换成同名；不改代码临时换机用 QGIS_DEV_AUTH_IP 等环境变量。
auth:
  username: admin
  password: admin

map:
  # 底图服务 API Key（provider 集中管理）：各底图 URL 用占位符引用本段真值，
  # 构建 QGIS 图层时才替换（见 basemap.apply_key_placeholders）：
  #   天地图 {tk}        → tianditu_tk
  #   高德   {gaode_key} → gaode_key（预留：当前高德走公开地址，URL 未引用本字段）
  # 换 key 只改这里一处（不用再改各处 URL / 模板）；新建或重载底图后生效。
  keys:
    tianditu_tk: cb75b0d8a671ec1acbf32c6835be5c65
    gaode_key: ""
  # 启动后自动加载的 XYZ 底图；enabled: false 则不加载
  base_tile:
    enabled: true
    name: 天地图影像
    type: xyz
    url: "https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}&tk={tk}"
    referer: "https://www.tianditu.gov.cn/"
    zmin: 0
    zmax: 18

  # 在线底图清单已独立到同目录 online_basemap_config.yaml（Dock「在线底图」树的数据源，
  # type 取值 / 写回方式见该文件注释头）。map.keys 与 base_tile 仍在本文件。
qgis:
  # dev 模式；prod 模式不读这里（路径走 QGIS_PREFIX）。
  #
  # 值支持 ${VAR} / ${VAR:-默认} 环境变量引用：
  #   - Windows 本地开发：不设变量，走默认 D:/zsh/app/qgis4.2（OSGeo4W 布局）
  #   - 麒麟源码运行：export QGIS_INSTALL_PATH=$CONDA_PREFIX 后自动生效；
  #     或什么都不设——bootstrap 检测到路径不存在时自动探测 conda/系统 QGIS
  install_path: ${QGIS_INSTALL_PATH:-D:/zsh/app/qgis4.2}
  # python_path / bin_path 仅兼容旧配置保留；bootstrap 一律从 install_path 推导
  python_path: ${QGIS_INSTALL_PATH:-D:/zsh/app/qgis4.2}/apps/qgis/python
  bin_path: ${QGIS_INSTALL_PATH:-D:/zsh/app/qgis4.2}/bin

paths:
  resource: resource
  log: logs
  tmp: .tmp

logging:
  level: INFO              # 控制台
  file_level: DEBUG        # 文件
  rotation_mb: 10
  backup_count: 5

server:
  host: 0.0.0.0
  port: 8000
  workers: 1

# ---------------------------------------------------------------------------
# 打包保护（tools/build_windows.ps1 的「原生编译保护」阶段读取）
# ---------------------------------------------------------------------------
build:
  protect:
    cython:
      # 把纯 Python 模块编译成原生扩展（Windows .pyd / Linux .so），产物里既不留
      # .py 也不留 .pyc，只剩机器码。这是本项目当前唯一「真正有效且免费」的
      # 编译保护：PyArmor 试用版拒绝大脚本，PyInstaller 6 已移除内置加密。
      enabled: true
      # 编译范围（点分包/模块，包会递归）。想把范围收窄可改成 app.core.auth 等。
      include:
        - app
      # 跳过编译、保持字节码的模块/包（点分路径，包会递归）
      exclude: []
      # 单个模块编译失败时回退为字节码，不中断构建
      fail_open: true
      # 模块级 ``def __getattr__``（PEP 562 惰性导出）的模块跳过编译：实测
      # Cython 编译后访问属性会与导入机无限递归（栈溢出），保持字节码。
      skip_module_getattr: true
      # 【重要】只编译不 import qgis/PyQt 的模块。Cython 编译后的函数/类与
      # PyQt 的 signal/slot 不兼容（.connect(编译方法) 会 TypeError 甚至硬崩溃
      # 0xC0000409），所以所有 Qt/QGIS 依赖模块一律保持字节码。
      # 本项目 Qt-free 模块 ≈110 个，已覆盖全部 app.core.auth（密钥/授权/凭据）、
      # app.core.data、app.core.util、app.core.domain 算法、app.infra、app.env、
      # app.server 等核心逻辑；剩下的主要是 UI。
      qt_free_only: true
      # 并行编译任务数；0 = 自动（CPU 核数）
      jobs: 0
      # 当前 QGIS 自带 Python 缺 Include/ 与 libs/。留空则自动探测：
      #   sysconfig → 环境变量 QGIS_PYTHON_INCLUDE / QGIS_PYTHON_LIBS
      #   → 同类 OSGeo4W / conda 安装（要求 python3XX.lib 次版本匹配）
      compiler_include: ""
      compiler_libs: ""
